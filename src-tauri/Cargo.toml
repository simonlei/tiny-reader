[package]
name = "tiny-reader"
version = "0.1.0"
description = "Tiny Reader - 跨平台极简 RSS 阅读器客户端"
authors = ["simon"]
edition = "2021"

[lib]
name = "tiny_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 用系统默认浏览器/关联程序打开链接（纯 Rust，跨平台）
open = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
