name: Release

# 构建 Tiny Reader 发布版本：
#   - 服务端：Linux x86_64 musl 静态编译（服务端只要 linux 版本）
#             用 musl 静态链接而非 glibc，产物不依赖目标机器 glibc 版本，
#             避免在 Ubuntu 24.04 编译、旧发行版运行报 GLIBC_2.xx not found。
#   - 客户端：Windows x86_64 + macOS universal + Android APK（客户端只要 windows/mac/android 版本）
#   - Tauri 更新器签名 latest.json
#   - Android 更新清单 android.json（版本、sha256、安装包地址）
#     注：COS 上的安装包对象名是 .bin 不是 .apk —— 默认域名不允许公网分发 APK/IPA
#     （GET 一律 403 DownloadForbidden），GitHub Release 上的资源名仍是 .apk。
#   - 更新通道与安装包同步到腾讯云 COS，供国内用户走 CDN 更新
#     （桌面端和 Android 的产物都先传到 GitHub Release，最后由 sync-cos 统一用 coscli 推送）
#   - 推送顺序敏感：先同步安装包（MSI/NSIS/APP/DMG + APK）并逐个探活，确认都能
#     下载后才推 latest.json / android.json。清单先到会让用户看到新版本却下载失败。
#
# 触发：
#   1. 推送 v* 标签 → 自动构建并发布 Release
#   2. Actions 页面手动运行 (workflow_dispatch)，需指定 tag
#
# 必需的 GitHub Secrets（Settings → Secrets and variables → Actions）：
#   TAURI_SIGNING_PRIVATE_KEY          # 更新器签名私钥内容（base64 字符串，由 tauri signer generate 生成）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD # 生成私钥时设置的密码
#
# 腾讯云 COS（构建产物 + 更新通道，只在 sync-cos 里使用）：
#   COS_BUCKET        # COS bucket 名称，例如 tiny-reader-1250000000
#   COS_REGION        # COS 地域，例如 ap-guangzhou
#   COS_SECRET_ID     # 腾讯云 API 密钥 ID
#   COS_SECRET_KEY    # 腾讯云 API 密钥 Key
#   UPDATER_CDN_BASE  # 更新通道根地址，例如 https://tiny-reader-1251477527.cos.ap-guangzhou.myqcloud.com
#                     # 须与 tauri.conf.json 的 plugins.updater.endpoints 前缀一致
#
# 可选（Android 正式签名；不配置则用仓库里的 android/dev.keystore，
# 包可以安装，但证书是公开的开发证书。配了之后覆盖安装需要与旧包证书一致）：
#   ANDROID_KEYSTORE_BASE64      # keystore 文件的 base64（base64 -i tinyreader.jks | pbcopy）
#   ANDROID_KEYSTORE_PASSWORD    # keystore 口令
#   ANDROID_KEY_ALIAS            # key alias
#   ANDROID_KEY_PASSWORD         # key 口令
#
# 可选（macOS 代码签名/公证；不配置则 ad-hoc 签名，产物可用但触发 Gatekeeper 提示）：
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#   注：更新器签名与 Apple 签名相互独立，不配 Apple 证书不影响应用内自动更新。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUST_BACKTRACE: 1

jobs:
  # ========== 第一步：只建 Release 实体 ==========
  # 原先 Release 由 tauri-action（release job）顺带创建，导致 build-server /
  # build-android 必须 needs: release，而 release 是 win+mac 的 matrix，
  # 会被迫等两个平台全部构建完。把实体创建独立出来后，三者可真正并行。
  create-release:
    name: Create Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Resolve tag
        id: vars
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          # 幂等：重复运行时若已存在则直接跳过，避免并发/重跑报错
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists, skipping create"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Tiny Reader $TAG" --generate-notes
          fi

  # ========== 服务端：仅 Linux ==========
  # 只依赖 create-release：上传需要 Release 实体存在，但不必等客户端构建完。
  build-server:
    name: Build Server (linux-x86_64)
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: server -> target
          key: linux-musl

      - name: Install musl tools
        # musl-gcc 用于静态链接；reqwest 用 rustls-tls、rusqlite 用 bundled，
        # 均不依赖系统 OpenSSL/SQLite，musl 下可直接静态编译。
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config

      - name: Bump version from tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          # 服务端版本写入 server/Cargo.toml（仅改内存中的工作副本，不回写 git）
          sed -i -E "0,/^version[[:space:]]*=/s/^(version[[:space:]]*=[[:space:]]*\")[0-9]+\.[0-9]+\.[0-9]+(\")/\1${VERSION}\2/" server/Cargo.toml
          grep -m1 '^version' server/Cargo.toml

      - name: Build server (musl static)
        # 静态链接 musl，产物不依赖目标机器的 glibc 版本，
        # 避免在新发行版编译、旧发行版运行时报 GLIBC_2.xx not found。
        run: cargo build --release --target x86_64-unknown-linux-musl --manifest-path server/Cargo.toml

      - name: Package server
        run: |
          mkdir -p dist
          cp server/target/x86_64-unknown-linux-musl/release/tiny-reader-server dist/
          cp server/config.example.toml dist/
          cd dist
          tar -czf tiny-reader-server-linux-x86_64-musl.tar.gz tiny-reader-server config.example.toml

      - name: Upload server to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload "$TAG" dist/tiny-reader-server-linux-x86_64-musl.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber

  # ========== 客户端：Android APK ==========
  # 只依赖 create-release：上传需要 Release 实体存在，但不必等 win/mac 构建完。
  build-android:
    name: Build Client (android)
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        # AGP 8.7 + Kotlin 2.0 要求 JDK 17（compileOptions 也是 17）。
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        # 不用 android-actions/setup-android：该 action 内部会执行
        # sdkmanager --install "tools"，而 Google 早已把旧的 "tools" 包
        # 从仓库移除（拆分为 cmdline-tools），导致
        #   "Failed to find package 'tools'" -> sdkmanager exit 1。
        # ubuntu runner 已预装 SDK（/usr/local/lib/android/sdk）与
        # cmdline-tools 16.0，直接复用即可，只需补装项目真正需要的组件。
        shell: bash
        run: |
          set -euo pipefail
          # 不依赖 ANDROID_HOME 是否已导出，显式指定 runner 预装的 SDK 路径。
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager

          # 接受 licenses，避免构建时卡在交互确认
          yes | sdkmanager --licenses >/dev/null || true

          # 只装 compileSdk 35 / targetSdk 35 与对应 build-tools。
          # 注意：绝不要装 "tools"，该包已不存在。
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

          sdkmanager --list_installed | head -20

          # 显式写 local.properties，保证 Gradle 定位到 runner 的 SDK。
          # 该文件已被 android/.gitignore 忽略，不会回传仓库。
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Gradle cache
        # Gradle 依赖缓存。key 含 gradle 文件哈希，依赖变更自动失效。
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Bump version from tag
        # 与桌面端一致：由 tag 注入 versionName，源码不回写 git。
        # versionCode 需要单调递增，用 run_number 保证每次发布都比上次大。
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          node scripts/bump_version.js "$VERSION"

      - name: Decode signing keystore
        # 正式证书可选。未配置时 assembleRelease 用仓库里的 dev.keystore 签名，
        # 产物可以安装；配了 secrets 则改用正式证书。
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set -> signing with android/dev.keystore"
            echo "dev_cert=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tinyreader.jks"
          # 直接导出供下一步组装 Gradle 参数，不再依赖 env 上下文（
          # GITHUB_ENV 变量无法在同 job 的 env: 块中通过 env. 读取）。
          echo "args=-PRELEASE_STORE_FILE=$RUNNER_TEMP/tinyreader.jks \
                -PRELEASE_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
                -PRELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }} \
                -PRELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_OUTPUT"
          echo "gradle_args_ready=1" >> "$GITHUB_OUTPUT"
          echo "keystore decoded, size=$(stat -c%s "$RUNNER_TEMP/tinyreader.jks") bytes"

      - name: Build release APK
        working-directory: android
        env:
          # versionCode 必须单调递增，用 run_number 保证每次发布递增。
          # Gradle 自动把 ORG_GRADLE_PROJECT_* 映射为 project property。
          ORG_GRADLE_PROJECT_versionCode: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace ${{ steps.keystore.outputs.args }}

      - name: Locate and rename APK
        id: apk
        shell: bash
        run: |
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          if [ -z "$APK" ]; then
            echo "::error::no APK produced"
            exit 1
          fi
          ls -lh "$APK"
          # 源文件名必须用 $APK（上面 find 的结果）。release 包始终已签名。
          SIGNED_OUT="tiny-reader-android-${{ github.event.inputs.tag || github.ref_name }}.apk"
          mv "$APK" "$SIGNED_OUT"
          echo "name=$SIGNED_OUT" >> "$GITHUB_OUTPUT"
          if [ -n "${{ steps.keystore.outputs.gradle_args_ready }}" ]; then
            echo "note=signed" >> "$GITHUB_OUTPUT"
          else
            echo "note=dev-cert" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload "$TAG" "${{ steps.apk.outputs.name }}" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Generate Android update manifest
        # 客户端把清单地址和安装包文件名写死在 AppUpdate.kt，这里必须生成同一份 URL。
        # android.json 不进 Tauri 的 latest.json：那份清单只给桌面端，而且每条都要 minisign。
        # 本 job 只负责构建 + 把 APK 和 android.json 传到 GitHub Release，
        # 推送 COS 统一交给 sync-cos（coscli），与桌面端走同一条链路。
        #
        # 名字有两个：GitHub Release 上留 .apk 给人手下载；COS 对象名用 .bin，
        # 因为 COS 默认域名不允许公网分发 .apk（GET 一律 403 DownloadForbidden）。
        # android.json 的 url 指向 .bin，sync-cos 下载 .apk 后改名再上传。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATER_CDN_BASE: ${{ secrets.UPDATER_CDN_BASE }}
        run: |
          set -euo pipefail
          if [ -z "${UPDATER_CDN_BASE}" ]; then
            echo "::error::UPDATER_CDN_BASE is required to build the Android update channel"
            exit 1
          fi
          command -v jq
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          APK="${{ steps.apk.outputs.name }}"
          HOST="tiny-reader-1251477527.cos.ap-guangzhou.myqcloud.com"
          CDN="${UPDATER_CDN_BASE%/}"
          ASSET="tiny-reader-android-v${VERSION}.apk"   # GitHub Release 资源名
          REMOTE="tiny-reader-android-v${VERSION}.bin"  # COS 对象名（见 AppUpdate.kt）
          if [ "$CDN" != "https://${HOST}" ]; then
            echo "::error::UPDATER_CDN_BASE ($CDN) must be https://${HOST} to match AppUpdate.kt"
            exit 1
          fi
          if [ "$APK" != "$ASSET" ]; then
            echo "::error::APK name $APK does not match $ASSET"
            exit 1
          fi
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          NOTES="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // "" | .[0:4000]')"
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg url "${CDN}/${REMOTE}" \
            --arg sha256 "$SHA256" \
            '{version:$version, notes:$notes, url:$url, sha256:$sha256}' > android.json
          gh release upload "$TAG" android.json --repo "$GITHUB_REPOSITORY" --clobber
          echo "APK + android.json uploaded to GitHub Release $TAG; sync-cos will push them to COS."

  # ========== 客户端：Windows + macOS ==========
  # 只依赖 create-release：Release 实体已建好，tauri-action 直接上传产物，
  # 不再需要服务端/Android 排在 win+mac 之后。
  release:
    name: Build Client (${{ matrix.name }})
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
            rust_targets: ''
            args: ''
          - os: macos-latest
            name: macos-universal
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Bump version from tag
        # 根据发布标签注入版本号，使 latest.json 的 version 与标签一致，
        # 更新器才能正确判断版本。仅在 CI 内改写，不回写 git，源码保持不动。
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          node scripts/bump_version.js "$VERSION"

      - name: Diagnose updater signing secrets
        # 诊断签名密钥是否真正注入。若 secret 名不匹配，secrets.XXX 会静默
        # 解析为空字符串，tauri-action 不报错但跳过签名，导致无 .sig /
        # latest.json。此处只打印长度与格式，绝不输出完整密钥。
        shell: bash
        env:
          SIGN_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGN_PWD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "=== updater signing secret diagnostics ==="
          echo "runner: ${{ matrix.name }}"
          if [ -z "$SIGN_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is EMPTY or NOT set (check secret name)"
          else
            echo "TAURI_SIGNING_PRIVATE_KEY: present, length=${#SIGN_KEY}"
            # 合法密钥是 base64，解码后应以 untrusted comment 开头
            DEC="$(echo "$SIGN_KEY" | base64 -d 2>/dev/null | head -c 30)"
            if [ -n "$DEC" ]; then
              echo "decoded prefix: ${DEC}"
            else
              echo "::warning::key is NOT valid base64 or not decodable"
            fi
          fi
          if [ -z "$SIGN_PWD" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is EMPTY or NOT set"
          else
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD: present, length=${#SIGN_PWD}"
          fi
          echo "=== updater config in tauri.conf.json ==="
          node -e "
            const c=require('fs').readFileSync('src-tauri/tauri.conf.json','utf8');
            const u=JSON.parse(c).plugins.updater;
            console.log('active:', u.active);
            console.log('pubkey set:', !!u.pubkey);
            console.log('endpoints:', u.endpoints);
          "

      - name: Normalize updater signing key
        # GitHub Secret 在粘贴时极易带上尾部换行（LF）。Tauri CLI 对密钥做
        # base64 解码，末尾多一个 LF 会直接失败：
        #   failed to decode base64 key: Invalid symbol 10, offset 348.
        # 这里去掉所有空白字符后重新导出，供后续 tauri-action 使用。
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PWD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          CLEAN_KEY="$(printf '%s' "$RAW_KEY" | tr -d '[:space:]')"
          CLEAN_PWD="$(printf '%s' "$RAW_PWD" | tr -d '[:space:]')"
          echo "key length: ${#RAW_KEY} -> ${#CLEAN_KEY}"
          if [ ${#CLEAN_KEY} -ne ${#RAW_KEY} ]; then
            echo "::warning::stripped whitespace from signing key"
          fi
          {
            echo "TAURI_SIGNING_PRIVATE_KEY=$CLEAN_KEY"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$CLEAN_PWD"
          } >> "$GITHUB_ENV"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri 更新器签名：生成各平台 .sig 并聚合为 latest.json。
          # 不再直接引用 secrets，改由上一个步骤清洗空白后写入 GITHUB_ENV，
          # 此处自动继承（同名环境变量会覆盖 job 级定义）。
          CARGO_INCREMENTAL: '0'
        with:
          # Release 实体已由 create-release 建好，此处只上传产物。
          # 关键是 releaseId：tauri-action 识别到后会跳过创建，直接上传。
          tagName: ${{ needs.create-release.outputs.tag }}
          releaseName: 'Tiny Reader ${{ needs.create-release.outputs.tag }}'
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Verify signing artifacts
        # 构建后确认签名产物是否生成。若这里为空，说明签名未生效，
        # 后续 sync-cos 必然找不到 latest.json。
        shell: bash
        run: |
          echo "=== signing artifacts produced ==="
          echo "--- .sig files ---"
          find src-tauri/target -name '*.sig' 2>/dev/null || true
          echo "--- latest.json ---"
          find src-tauri/target -name 'latest.json' 2>/dev/null || true
          echo "--- bundle dir listing ---"
          find src-tauri/target -path '*bundle*' -maxdepth 4 -type d 2>/dev/null | head -20 || true

  # ========== 更新通道 + 安装包同步到腾讯云 COS ==========
  # 等 release（桌面端 latest.json + 安装包）和 build-android（android.json + APK）：
  # 两个 job 都只负责构建并把产物传到 GitHub Release，推送 COS 统一在这里用 coscli 做，
  # 避免 Android 单独用 aws s3 走另一条链路。
  # 服务端包不在 latest.json 的 platforms 里，也不需同步 COS，故不依赖 build-server。
  #
  # 客户端读的更新清单是 COS 上的 latest.json / android.json（见 tauri.conf.json 的
  # endpoints 与 AppUpdate.kt 的 UPDATE_MANIFEST_URL），因此这里必须「安装包先上、
  # 清单最后上」：coscli 并发上传，清单只有几 KB，混在一起传必然先落地，
  # 那一小段时间里用户会看到新版本但下载 404。
  sync-cos:
    needs: [release, build-android]
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - name: Download release assets from GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          mkdir -p cos-assets && cd cos-assets

          # latest.json 由 tauri-action 在【签名生效】时才生成。
          # 若缺失，说明 TAURI_SIGNING_PRIVATE_KEY / PASSWORD 未配置或为空，
          # 此时 tauri-action 只上传安装包本体，不产出 .sig 与 latest.json。
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "latest.json"; then
            echo "::error::latest.json not found in release $TAG."
            echo "::error::This means the updater was NOT signed — check secrets:"
            echo "::error::  TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            echo "Available assets in release:"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name'
            exit 1
          fi

          # 按 latest.json 实际引用的文件名逐个下载（只信清单引用）
          mapfile -t ASSETS < <(jq -r '.platforms[].url | split("/") | .[-1]' latest.json | awk '!s[$0]++')
          for f in "${ASSETS[@]}"; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$f"
            echo "downloaded: $f"
          done

          # Android 更新通道：清单由 build-android 产出并随 APK 一起传到 Release。
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "android.json"; then
            echo "::error::android.json not found in release $TAG (build-android failed or was skipped)."
            echo "Available assets in release:"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name'
            exit 1
          fi
          # 同样只信清单引用：COS 对象名以 android.json 里写的为准（.bin）。
          # GitHub Release 上的资源名还是同版本的 .apk，给手动下载的人用；
          # sync-cos 下载后改名成 .bin 再上传，内容不变，sha256 仍对得上。
          APK_REMOTE="$(jq -r '.url | split("/") | .[-1]' android.json)"
          APK_ASSET="tiny-reader-android-v${VERSION}.apk"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$APK_ASSET" || {
            echo "::error::APK $APK_ASSET not found in release $TAG"
            exit 1
          }
          mv "$APK_ASSET" "$APK_REMOTE"
          # 下载到的包必须与清单里的 sha256 一致，否则端到端升级会校验失败
          echo "$(jq -r '.sha256' android.json)  ${APK_REMOTE}" | sha256sum -c - || {
            echo "::error::downloaded $APK_REMOTE does not match android.json sha256"
            exit 1
          }
          echo "downloaded: android.json + $APK_REMOTE (from release asset $APK_ASSET)"

      - name: Rewrite latest.json to COS CDN
        env:
          UPDATER_CDN_BASE: ${{ secrets.UPDATER_CDN_BASE }}
        run: |
          set -euo pipefail
          cd cos-assets
          BASE="${UPDATER_CDN_BASE%/}"
          jq --arg base "$BASE" \
             '.platforms |= map_values(.url = ($base + "/" + (.url | split("/") | .[-1])))' \
             latest.json > .tmp && mv .tmp latest.json
          echo "Rewrote latest.json URLs to $BASE"

          # android.json 在 build-android 里已按 UPDATER_CDN_BASE 生成（AppUpdate.kt 硬性要求），
          # 这里只做一致性确认，避免两份清单指向不同域名。
          case "$(jq -r '.url' android.json)" in
            "${BASE}/"*) echo "android.json URL OK: $(jq -r '.url' android.json)" ;;
            *)
              echo "::error::android.json URL $(jq -r '.url' android.json) is not under $BASE"
              exit 1
              ;;
          esac

          # 清单与安装包分开目录，才能分两次推送：先 cos-assets（安装包），
          # 探活通过后最后推 cos-manifests（latest.json / android.json）。
          mkdir -p ../cos-manifests
          mv latest.json android.json ../cos-manifests/
          echo "--- installers (upload first) ---"
          ls -lh
          echo "--- manifests (upload last) ---"
          ls -lh ../cos-manifests

      - name: Install coscli
        # 固定 v1.0.9。该版本起资源名带版本号（coscli-v1.0.9-linux-amd64），
        # 不再是旧文档里的 coscli-linux-amd64。
        run: |
          set -euo pipefail
          COSCLI_VERSION=v1.0.9
          COSCLI_SHA256=a07de5ba2800147a700ed29036b0c76a4229088cee68e1682d0eae19b638a915
          curl -fsSL -o "$RUNNER_TEMP/coscli" \
            "https://github.com/tencentyun/coscli/releases/download/${COSCLI_VERSION}/coscli-${COSCLI_VERSION}-linux-amd64"
          echo "${COSCLI_SHA256}  ${RUNNER_TEMP}/coscli" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/coscli"
          "$RUNNER_TEMP/coscli" --version

      - name: Sync to COS (installers first, manifests last)
        # 腾讯云官方 coscli。--init-skip 跳过交互式 config init，
        # 直接用 -i/-k/-e，不写 ~/.cos.yaml（手写配置还会把密钥当密文解密）。
        # 目录两侧都带 /，上传的是目录里的文件，而不是多套一层目录。
        # 跨太平洋链路慢（实测 30~40 KB/s），整次失败再退避重试，因此：
        #   --routines 4    并发 4 个文件，长肥管道上比 2 路更能跑满带宽
        #   --part-size 4   大于 4MB 才分块，让十几 MB 的安装包也走分块上传
        #   --check-point   分块上传默认开启断点续传，重试只补未完成的块，
        #                   不用像 --check-point=false 那样每次从头传 17MB
        #   --thread-num 4  单文件内的分块并发
        #
        # 两个阶段：
        #   1. cos-assets/    安装包（MSI/NSIS/APP/DMG + APK）
        #   2. cos-manifests/ latest.json + android.json（清单最后上）
        # 中间逐个 HEAD 探活，任一安装包取不到就中止，绝不让清单先于安装包生效。
        env:
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          set -euo pipefail
          EP="cos.${COS_REGION}.myqcloud.com"
          MAX_RETRIES=5

          cos_sync() {
            local dir="$1"
            for i in $(seq 1 "$MAX_RETRIES"); do
              if "$RUNNER_TEMP/coscli" sync "$dir" "cos://${COS_BUCKET}/" -r \
                --init-skip=true \
                -i "$COS_SECRET_ID" \
                -k "$COS_SECRET_KEY" \
                -e "$EP" \
                --routines 4 \
                --thread-num 4 \
                --part-size 4 \
                --skip-dir \
                --force \
                --check-point=true \
                --process-log-path "$RUNNER_TEMP/coscli_output" \
                --fail-output-path "$RUNNER_TEMP/coscli_output"; then
                echo "Sync $dir succeeded on attempt $i."
                return 0
              fi
              echo "Sync $dir attempt $i failed."
              if [ -d "$RUNNER_TEMP/coscli_output" ]; then
                find "$RUNNER_TEMP/coscli_output" -type f -print -exec cat {} \;
              fi
              if [ "$i" -eq "$MAX_RETRIES" ]; then
                echo "ERROR: sync $dir failed after $MAX_RETRIES attempts."
                return 1
              fi
              SLEEP=$((i * i * 5))
              echo "Retrying in ${SLEEP}s..."
              sleep "$SLEEP"
            done
          }

          echo "=== phase 1/2: installers ==="
          cos_sync cos-assets/

          echo "=== verify every installer URL is downloadable ==="
          mapfile -t URLS < <(
            jq -r '.platforms[].url' cos-manifests/latest.json
            jq -r '.url' cos-manifests/android.json
          )
          for u in "${URLS[@]}"; do
            CODE=""
            for i in $(seq 1 10); do
              # 必须真读 1 字节，不能用 HEAD：COS 对 APK/IPA 有 DownloadForbidden
              # 限制（默认域名不允许公网分发），HEAD 照样返回 200，只有 GET/Range
              # 才暴露 403。用 HEAD 探活会漏掉「能看到新版本但下不下来」。
              CODE="$(curl -sL -o /dev/null -w '%{http_code}' -r 0-0 --max-time 30 "$u" || true)"
              if [ "$CODE" = "200" ] || [ "$CODE" = "206" ]; then break; fi
              if [ "$i" -eq 10 ]; then break; fi
              echo "  $u -> HTTP ${CODE:-000} (attempt $i), retry in 10s"
              sleep 10
            done
            if [ "$CODE" != "200" ] && [ "$CODE" != "206" ]; then
              echo "::error::installer not downloadable, abort before publishing manifests: $u"
              exit 1
            fi
            echo "  downloadable: $u"
          done

          echo "=== phase 2/2: update manifests ==="
          cos_sync cos-manifests/
          echo "Synced installers and update manifests to COS."
