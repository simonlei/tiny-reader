name: Release

# 构建 Tiny Reader 发布版本：
#   - 服务端：Linux x86_64 musl 静态编译（服务端只要 linux 版本）
#             用 musl 静态链接而非 glibc，产物不依赖目标机器 glibc 版本，
#             避免在 Ubuntu 24.04 编译、旧发行版运行报 GLIBC_2.xx not found。
#   - 客户端：Windows x86_64 + macOS universal + Android APK（客户端只要 windows/mac/android 版本）
#   - Tauri 更新器签名 latest.json
#   - 更新通道与安装包同步到腾讯云 COS，供国内用户走 CDN 更新
#
# 触发：
#   1. 推送 v* 标签 → 自动构建并发布 Release
#   2. Actions 页面手动运行 (workflow_dispatch)，需指定 tag
#
# 必需的 GitHub Secrets（Settings → Secrets and variables → Actions）：
#   TAURI_SIGNING_PRIVATE_KEY          # 更新器签名私钥内容（base64 字符串，由 tauri signer generate 生成）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD # 生成私钥时设置的密码
#
# 腾讯云 COS（构建产物 + 更新通道）：
#   COS_BUCKET        # COS bucket 名称，例如 tiny-reader-1250000000
#   COS_REGION        # COS 地域，例如 ap-guangzhou
#   COS_SECRET_ID     # 腾讯云 API 密钥 ID
#   COS_SECRET_KEY    # 腾讯云 API 密钥 Key
#   UPDATER_CDN_BASE  # 更新通道根地址，例如 https://tiny-reader-1251477527.cos.ap-guangzhou.myqcloud.com
#                     # 须与 tauri.conf.json 的 plugins.updater.endpoints 前缀一致
#
# 可选（Android APK 签名；不配置则产出未签名的 release APK，可构建但无法直接安装到普通用户设备）：
#   ANDROID_KEYSTORE_BASE64      # keystore 文件的 base64（base64 -i tinyreader.jks | pbcopy）
#   ANDROID_KEYSTORE_PASSWORD    # keystore 口令
#   ANDROID_KEY_ALIAS            # key alias
#   ANDROID_KEY_PASSWORD         # key 口令
#
# 可选（macOS 代码签名/公证；不配置则 ad-hoc 签名，产物可用但触发 Gatekeeper 提示）：
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#   注：更新器签名与 Apple 签名相互独立，不配 Apple 证书不影响应用内自动更新。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUST_BACKTRACE: 1

jobs:
  # ========== 服务端：仅 Linux ==========
  # 依赖 release：服务端要上传到 GitHub Release，必须等 Release 实体先建好，
  # 否则 gh release upload 报 "release not found"。
  build-server:
    name: Build Server (linux-x86_64)
    needs: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: server -> target
          key: linux-musl

      - name: Install musl tools
        # musl-gcc 用于静态链接；reqwest 用 rustls-tls、rusqlite 用 bundled，
        # 均不依赖系统 OpenSSL/SQLite，musl 下可直接静态编译。
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config

      - name: Bump version from tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          # 服务端版本写入 server/Cargo.toml（仅改内存中的工作副本，不回写 git）
          sed -i -E "0,/^version[[:space:]]*=/s/^(version[[:space:]]*=[[:space:]]*\")[0-9]+\.[0-9]+\.[0-9]+(\")/\1${VERSION}\2/" server/Cargo.toml
          grep -m1 '^version' server/Cargo.toml

      - name: Build server (musl static)
        # 静态链接 musl，产物不依赖目标机器的 glibc 版本，
        # 避免在新发行版编译、旧发行版运行时报 GLIBC_2.xx not found。
        run: cargo build --release --target x86_64-unknown-linux-musl --manifest-path server/Cargo.toml

      - name: Package server
        run: |
          mkdir -p dist
          cp server/target/x86_64-unknown-linux-musl/release/tiny-reader-server dist/
          cp server/config.example.toml dist/
          cd dist
          tar -czf tiny-reader-server-linux-x86_64-musl.tar.gz tiny-reader-server config.example.toml

      - name: Upload server to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload "$TAG" dist/tiny-reader-server-linux-x86_64-musl.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber

  # ========== 客户端：Android APK ==========
  # 依赖 release：APK 要上传到 GitHub Release，必须等 Release 实体先建好，
  # 否则 gh release upload 报 "release not found"（与 build-server 同理）。
  build-android:
    name: Build Client (android)
    needs: release
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        # AGP 8.7 + Kotlin 2.0 要求 JDK 17（compileOptions 也是 17）。
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        # Gradle 依赖缓存。key 含 gradle 文件哈希，依赖变更自动失效。
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Bump version from tag
        # 与桌面端一致：由 tag 注入 versionName，源码不回写 git。
        # versionCode 需要单调递增，用 run_number 保证每次发布都比上次大。
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          node scripts/bump_version.js "$VERSION"

      - name: Decode signing keystore
        # 签名是可选的：未配置 ANDROID_KEYSTORE_BASE64 时跳过，
        # assembleRelease 产出未签名 APK，不阻断整个发布流程。
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set -> building UNSIGNED release APK"
            echo "unpackaged=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tinyreader.jks"
          # 直接导出供下一步组装 Gradle 参数，不再依赖 env 上下文（
          # GITHUB_ENV 变量无法在同 job 的 env: 块中通过 env. 读取）。
          echo "args=-PRELEASE_STORE_FILE=$RUNNER_TEMP/tinyreader.jks \
-PRELEASE_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
-PRELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }} \
-PRELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_OUTPUT"
          echo "gradle_args_ready=1" >> "$GITHUB_OUTPUT"
          echo "keystore decoded, size=$(stat -c%s "$RUNNER_TEMP/tinyreader.jks") bytes"

      - name: Build release APK
        working-directory: android
        env:
          # versionCode 必须单调递增，用 run_number 保证每次发布递增。
          # Gradle 自动把 ORG_GRADLE_PROJECT_* 映射为 project property。
          ORG_GRADLE_PROJECT_versionCode: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace ${{ steps.keystore.outputs.args }}

      - name: Locate and rename APK
        id: apk
        shell: bash
        run: |
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          if [ -z "$APK" ]; then
            echo "::error::no APK produced"
            exit 1
          fi
          ls -lh "$APK"
          # 未签名 APK 加 -unsigned 后缀，避免和签名包混淆
          if [ -n "${{ steps.keystore.outputs.gradle_args_ready }}" ]; then
            SIGNED_OUT="tiny-reader-android-${{ github.event.inputs.tag || github.ref_name }}.apk"
            mv "$OUT" "$SIGNED_OUT"
            echo "name=$SIGNED_OUT" >> "$GITHUB_OUTPUT"
            echo "note=signed" >> "$GITHUB_OUTPUT"
          else
            UNSIGNED_OUT="tiny-reader-android-${{ github.event.inputs.tag || github.ref_name }}-unsigned.apk"
            mv "$OUT" "$UNSIGNED_OUT"
            echo "name=$UNSIGNED_OUT" >> "$GITHUB_OUTPUT"
            echo "note=unsigned" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload "$TAG" "${{ steps.apk.outputs.name }}" \
            --repo "$GITHUB_REPOSITORY" --clobber

  # ========== 客户端：Windows + macOS ==========
  release:
    name: Build Client (${{ matrix.name }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
            rust_targets: ''
            args: ''
          - os: macos-latest
            name: macos-universal
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Bump version from tag
        # 根据发布标签注入版本号，使 latest.json 的 version 与标签一致，
        # 更新器才能正确判断版本。仅在 CI 内改写，不回写 git，源码保持不动。
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          node scripts/bump_version.js "$VERSION"

      - name: Diagnose updater signing secrets
        # 诊断签名密钥是否真正注入。若 secret 名不匹配，secrets.XXX 会静默
        # 解析为空字符串，tauri-action 不报错但跳过签名，导致无 .sig /
        # latest.json。此处只打印长度与格式，绝不输出完整密钥。
        shell: bash
        env:
          SIGN_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGN_PWD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "=== updater signing secret diagnostics ==="
          echo "runner: ${{ matrix.name }}"
          if [ -z "$SIGN_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is EMPTY or NOT set (check secret name)"
          else
            echo "TAURI_SIGNING_PRIVATE_KEY: present, length=${#SIGN_KEY}"
            # 合法密钥是 base64，解码后应以 untrusted comment 开头
            DEC="$(echo "$SIGN_KEY" | base64 -d 2>/dev/null | head -c 30)"
            if [ -n "$DEC" ]; then
              echo "decoded prefix: ${DEC}"
            else
              echo "::warning::key is NOT valid base64 or not decodable"
            fi
          fi
          if [ -z "$SIGN_PWD" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is EMPTY or NOT set"
          else
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD: present, length=${#SIGN_PWD}"
          fi
          echo "=== updater config in tauri.conf.json ==="
          node -e "
            const c=require('fs').readFileSync('src-tauri/tauri.conf.json','utf8');
            const u=JSON.parse(c).plugins.updater;
            console.log('active:', u.active);
            console.log('pubkey set:', !!u.pubkey);
            console.log('endpoints:', u.endpoints);
          "

      - name: Normalize updater signing key
        # GitHub Secret 在粘贴时极易带上尾部换行（LF）。Tauri CLI 对密钥做
        # base64 解码，末尾多一个 LF 会直接失败：
        #   failed to decode base64 key: Invalid symbol 10, offset 348.
        # 这里去掉所有空白字符后重新导出，供后续 tauri-action 使用。
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PWD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          CLEAN_KEY="$(printf '%s' "$RAW_KEY" | tr -d '[:space:]')"
          CLEAN_PWD="$(printf '%s' "$RAW_PWD" | tr -d '[:space:]')"
          echo "key length: ${#RAW_KEY} -> ${#CLEAN_KEY}"
          if [ ${#CLEAN_KEY} -ne ${#RAW_KEY} ]; then
            echo "::warning::stripped whitespace from signing key"
          fi
          {
            echo "TAURI_SIGNING_PRIVATE_KEY=$CLEAN_KEY"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$CLEAN_PWD"
          } >> "$GITHUB_ENV"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri 更新器签名：生成各平台 .sig 并聚合为 latest.json。
          # 不再直接引用 secrets，改由上一个步骤清洗空白后写入 GITHUB_ENV，
          # 此处自动继承（同名环境变量会覆盖 job 级定义）。
          CARGO_INCREMENTAL: '0'
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Tiny Reader ${{ github.event.inputs.tag || github.ref_name }}'
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Verify signing artifacts
        # 构建后确认签名产物是否生成。若这里为空，说明签名未生效，
        # 后续 sync-cos 必然找不到 latest.json。
        shell: bash
        run: |
          echo "=== signing artifacts produced ==="
          echo "--- .sig files ---"
          find src-tauri/target -name '*.sig' 2>/dev/null || true
          echo "--- latest.json ---"
          find src-tauri/target -name 'latest.json' 2>/dev/null || true
          echo "--- bundle dir listing ---"
          find src-tauri/target -path '*bundle*' -maxdepth 4 -type d 2>/dev/null | head -20 || true

  # ========== 更新通道 + 安装包同步到腾讯云 COS ==========
  # 需同时等 release（客户端产物 + latest.json）和 build-server（服务端包）。
  sync-cos:
    needs: [release, build-server]
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - name: Download release assets from GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p cos-assets && cd cos-assets

          # latest.json 由 tauri-action 在【签名生效】时才生成。
          # 若缺失，说明 TAURI_SIGNING_PRIVATE_KEY / PASSWORD 未配置或为空，
          # 此时 tauri-action 只上传安装包本体，不产出 .sig 与 latest.json。
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "latest.json"; then
            echo "::error::latest.json not found in release $TAG."
            echo "::error::This means the updater was NOT signed — check secrets:"
            echo "::error::  TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            echo "Available assets in release:"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name'
            exit 1
          fi

          # 按 latest.json 实际引用的文件名逐个下载（只信清单引用）
          mapfile -t ASSETS < <(jq -r '.platforms[].url | split("/") | .[-1]' latest.json | awk '!s[$0]++')
          for f in "${ASSETS[@]}"; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$f"
            echo "downloaded: $f"
          done

      - name: Rewrite latest.json to COS CDN
        env:
          UPDATER_CDN_BASE: ${{ secrets.UPDATER_CDN_BASE }}
        run: |
          cd cos-assets
          jq --arg base "${UPDATER_CDN_BASE%/}" \
             '.platforms |= map_values(.url = ($base + "/" + (.url | split("/") | .[-1])))' \
             latest.json > .tmp && mv .tmp latest.json
          echo "Rewrote latest.json URLs to $UPDATER_CDN_BASE"

      - name: Sync updater artifacts to Tencent COS
        # runner 预装 AWS CLI v2，直接对接腾讯云 COS（S3 兼容），无需 pip 安装。
        # virtual-hosted-style：COS 禁用 path-style（否则 PathStyleDomainForbidden）。
        # payload_signing_enabled=false：COS 严格要求 Content-Length，
        # 而 CLI v2 分片上传默认 aws-chunked 流式签名不带该头（MissingContentLength）。
        env:
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          aws configure set aws_access_key_id "$COS_SECRET_ID"
          aws configure set aws_secret_access_key "$COS_SECRET_KEY"
          aws configure set region "$COS_REGION"
          aws configure set s3.addressing_style virtual
          aws configure set s3.payload_signing_enabled false
          # 跨太平洋链路慢，降并发 + 重试兜 COS 专有的 UserNetworkTooSlow
          aws configure set s3.max_concurrent_requests 2
          aws configure set default.retry_mode standard
          aws configure set default.max_attempts 8
          EP="https://cos.$COS_REGION.myqcloud.com"
          MAX_RETRIES=5
          for i in $(seq 1 "$MAX_RETRIES"); do
            if aws s3 sync cos-assets "s3://$COS_BUCKET" --endpoint-url "$EP"; then
              echo "Sync succeeded on attempt $i."
              break
            fi
            echo "Sync attempt $i failed."
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: sync failed after $MAX_RETRIES attempts."
              exit 1
            fi
            SLEEP=$((i * i * 5))
            echo "Retrying in ${SLEEP}s..."
            sleep "$SLEEP"
          done
          echo "Synced updater artifacts to COS."
