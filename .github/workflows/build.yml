name: Build Server and Client

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUST_BACKTRACE: 1

jobs:
  # 服务端：只需要 Linux 版本
  build-server:
    name: Build Server (linux-x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-server-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-server-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Build server
        run: cargo build --release --manifest-path server/Cargo.toml

      - name: Package server
        run: |
          mkdir -p dist
          cp server/target/release/tiny-reader-server dist/
          cp server/config.example.toml dist/
          cd dist
          tar -czf tiny-reader-server-linux-x86_64.tar.gz tiny-reader-server config.example.toml

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiny-reader-server-linux-x86_64
          path: dist/tiny-reader-server-linux-x86_64.tar.gz

  # 客户端：只需要 Windows / macOS 版本
  build-client:
    name: Build Client (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
            rust_targets: ""
            args: ""
            bundle_dir: src-tauri/target/release/bundle
          - os: macos-latest
            name: macos-universal
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            bundle_dir: src-tauri/target/universal-apple-darwin/release/bundle

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # 仅 macOS 需要额外 target，用于构建 universal 二进制
          targets: ${{ matrix.rust_targets }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-client-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-client-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install frontend dependencies
        run: npm install

      # 不设置 tagName / releaseName / releaseId => 只构建，不创建 GitHub Release
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      # Windows 产物：msi（WiX）+ exe（NSIS）
      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: tiny-reader-client-windows-x86_64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # macOS 产物：dmg + app（app 是目录，需先压缩为 zip）
      - name: Zip macOS app
        if: matrix.os == 'macos-latest'
        run: |
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent "Tiny Reader.app" "../Tiny Reader.app.zip"

      - name: Upload macOS artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: tiny-reader-client-macos-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/Tiny Reader.app.zip
          if-no-files-found: error
